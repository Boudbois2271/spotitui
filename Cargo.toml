[package]
name = "spotitui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Spotify player for the terminal that follows your Omarchy theme"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
http = "1"
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
librespot-connect = "=0.8.0"
librespot-core = "=0.8.0"
librespot-metadata = "=0.8.0"
librespot-playback = { version = "=0.8.0", features = ["pulseaudio-backend", "rodio-backend"] }
librespot-protocol = "=0.8.0"
log = { version = "0.4", features = ["std"] }
protobuf = "=3.7.2"
protobuf-json-mapping = "=3.7.2"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
toml = "0.9"
unicode-width = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
